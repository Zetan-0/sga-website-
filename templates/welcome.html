<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Welcome to Student Government Central - University of Lynchburg</title>
    <style>
       body { font-family: Arial, sans-serif; margin: 0; background-color: #f4f4f9; color: #000000; }
       header { background-color: #7d031f; color: white; padding: 40px 20px; text-align: left; border-radius: 5px; } /* Lynchburg Criimson inspired color */
    .brand-header { display: flex; justify-content: space-between; align-items: center; gap: 16px; }
    .live-clock { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.25); border-radius: 24px; background: rgba(255,255,255,0.15); white-space: nowrap; }
    .live-dot { width: 8px; height: 8px; border-radius: 50%; background: #53d769; }
       header + header { margin-top: 20px; }
       header:first-of-type { border-radius: 0; }
       nav { margin: 0; text-align: center; }
       nav a { margin: 0; color: #7d031f; text-decoration: none; font-weight: bold; }
       .container { background: white; padding: 20px; border-radius: 0; box-shadow: 0 2px 5px rgba(0,0,0,0.1); }
       .btn { background: #7d031f; color: white; padding: 40px 20px; text-decoration: none; border-radius; 3px; display: inline-block; margin-top: 15px; }
    </style>

<body>
    <header class="brand-header">
        <h2>Student Government Central</h2>
        <p>sga.lynchburg.edu • Events &amp; Campus Life</p>
     </div>
     <div class="live-clock">
        <span class="live-dot"></span>
        <time id="live-clock"></time>
     </div>
    </header>
    <script>
        const clock = document.getElementById("live-clock");

        function updateClock() {
            const now = new Date();
            const date = new Intl.DateTimeFormat("en-US", {
                weekday: "long",
                month: "long",
                day: "numeric",
                year: "numeric"
            }).format(now);
            const time = new Intl.DateTimeFormat("en-US", {
                hour: "numeric",
                minute: "2-digit",
                second: "2-digit"
            }).format(now);

            clock.textContent = `${date} | ${time}`;
        }

        updateClock();
        setInterval(updateClock, 1000);
    </script>
    
</body>

<body>
    <header>
        <h1>Make Your Campus Moment Happen</h1>
        <p>Discover what's happening around the University of Lynchburg. Find events, meet new people, explore organizations, and make the most of your time as a Hornet.</p>
    </header>
 </div>
</body>
